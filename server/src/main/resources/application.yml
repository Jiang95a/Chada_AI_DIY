server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: campus-diy-server
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    default-property-inclusion: non_null
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:campus_diy}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USER:campus_app}
    # 【无默认值，但必须写成空默认 ${DB_PASSWORD:}】
    # 缺少环境变量时启动失败，而不是悄悄用仓库里写死的密码。
    # 写成 ${DB_PASSWORD:} 的原因同下方 jwt.secret：不写 `:` 时 Spring 会把
    # 字面量 "${DB_PASSWORD}" 当成密码去连库，报出来的错是「Access denied」，
    # 让人以为是密码错了，其实是根本没配。
    # 本地开发请激活 dev profile（见 application-dev.yml）。
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 8000
      pool-name: campus-pool
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.campus.server.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

# ---------------------------------------------------------------- 应用配置
app:
  # 前端开发服务器地址，用于 Cookie 与 CORS
  web-origin: ${WEB_ORIGIN:http://localhost:5173}
  # 对外可访问的公开活动地址前缀（发布后拼成 publicUrl）
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173/p}
  # 后端自身的对外基地址：上传文件要返回绝对 URL，否则前端跨端口访问会 404
  api-base-url: ${API_BASE_URL:http://127.0.0.1:8080}
  # 智能体服务地址：后端调用它，前端不要直连
  agent-base-url: ${AGENT_BASE_URL:http://127.0.0.1:8000}
  agent-timeout-seconds: 90
  # AI 海报出图比对话慢得多（图像模型普遍 30~120 秒），单独放宽，见 AppProperties#imageTimeoutSeconds
  image-timeout-seconds: ${IMAGE_TIMEOUT_SECONDS:180}
  jwt:
    # 【无默认值，但必须写成空默认 ${JWT_SECRET:}】
    # 生产必须通过环境变量提供，至少 32 字节。缺少时启动失败。
    #
    # 为什么不能直接写 ${JWT_SECRET}：变量未定义时 Spring 不会报错，
    # 而是把字面量 "${JWT_SECRET}" 原样当作值绑进去（13 字节），
    # 于是报出「当前 13 字节」这种对排错毫无帮助的错误。
    # 写成 ${JWT_SECRET:} 让它解析成空串，由 JwtService 抛出带指引的异常。
    #
    # 原来这里写死了一个开发密钥，等于把签发 token 的能力公开在仓库里，
    # 任何人都能拿它伪造合法 token。本地开发请激活 dev profile（见 application-dev.yml）。
    secret: ${JWT_SECRET:}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  upload:
    max-mb: ${UPLOAD_MAX_MB:10}
    # 本地开发用磁盘兜底，生产替换为阿里云 OSS
    dir: ${UPLOAD_DIR:./uploads}
  # ---------------------------------------------------------------- 回看智能体
  # 施工需求 2.3：模型配置只能从这里读，禁止写进前端、禁止提交进 git、禁止打日志。
  # 全部留空 = 未配置：POST /insights/analyze 会返回 analysis_error 并说明没配模型，
  # 不会假装分析成功，也不会返回编造的结论。
  # 走 OpenAI 兼容的 POST {base-url}/chat/completions，deepseek / 通义 / 智谱都能用。
  ai:
    provider: ${AI_PROVIDER:}
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    # 回看要生成一段结构化 JSON，60 秒够；超时返回 analysis_error 让用户重试
    timeout-ms: ${AI_TIMEOUT_MS:60000}

logging:
  level:
    root: info
    com.campus.server: debug
    com.campus.server.mapper: info
